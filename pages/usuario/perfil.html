<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - UThub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <style>
    body {
      background: #F7F4F0;
      min-height: 100vh;
    }

    .header .nav.container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .header .nav-menu {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .header .user-menu {
      margin-left: auto;
    }

    .header .user-menu-btn {
      min-height: 52px;
    }

    .header .user-menu-btn::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg) translateY(-2px);
      margin-left: 4px;
    }

    .profile-page {
      max-width: 1080px;
      margin: 110px auto 48px;
      padding: 0 24px;
    }

    .profile-hero {
      background: linear-gradient(135deg, #1A1A2E 0%, #2D2D44 60%, #F5841F 160%);
      color: white;
      border-radius: 28px;
      padding: 34px;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 22px;
      align-items: center;
      box-shadow: 0 18px 45px rgba(26, 26, 46, .18);
      margin-bottom: 24px;
    }

    .profile-avatar-lg {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: #FFF0E0;
      color: #F5841F;
      font-family: 'Syne', sans-serif;
      font-size: 34px;
      font-weight: 800;
      overflow: hidden;
    }

    .profile-avatar-lg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
      margin-bottom: 8px;
    }

    .profile-subtitle {
      color: rgba(255, 255, 255, .72);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 24px;
    }

    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 8px 28px rgba(26, 26, 46, .08);
    }

    .profile-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 18px;
      color: #1A1A2E;
    }

    .profile-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .profile-field.full {
      grid-column: 1 / -1;
    }

    .profile-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #1A1A2E;
      margin-bottom: 7px;
    }

    .profile-input {
      width: 100%;
      border: 1.5px solid #E8E4DE;
      border-radius: 14px;
      padding: 13px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    .profile-input:focus {
      border-color: #F5841F;
      box-shadow: 0 0 0 4px rgba(245, 132, 31, .12);
    }

    .profile-input[readonly] {
      background: #F7F4F0;
      color: #6B6B80;
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .profile-info-list {
      display: grid;
      gap: 12px;
    }

    .profile-info-item {
      padding: 14px;
      border-radius: 16px;
      background: #FAFAF8;
    }

    .profile-info-label {
      display: block;
      color: #6B6B80;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .profile-info-value {
      color: #1A1A2E;
      font-weight: 800;
    }

    .profile-status {
      min-height: 22px;
      margin-top: 12px;
      color: #22C55E;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .profile-hero,
      .profile-grid,
      .profile-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header" id="header">
    <nav class="nav container">
      <a href="../../index.html" class="logo">
        <span class="logo-ut">UT</span><span class="logo-hub">hub</span>
      </a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="../dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="../comida/tiendas.html" class="nav-link">Comida</a></li>
        <li><a href="../tutorias/buscar.html" class="nav-link">Tutorías</a></li>
        <li><a href="../libros/catalogo.html" class="nav-link">Libros</a></li>
        <li><a href="../servicios/explorar.html" class="nav-link">Servicios</a></li>
      </ul>
      <div class="user-menu">
        <button class="user-menu-btn" id="user-menu-btn" type="button" aria-label="Abrir menú de usuario">
          <span class="user-avatar" id="user-initials">UT</span>
          <span id="user-name">Mi Perfil</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="profile-page">
    <section class="profile-hero">
      <div class="profile-avatar-lg" id="profile-avatar">UT</div>
      <div>
        <h1 class="profile-title">Mi Perfil</h1>
        <p class="profile-subtitle">Administra tus datos visibles dentro de UThub.</p>
      </div>
    </section>

    <section class="profile-grid">
      <article class="profile-card">
        <h2 class="profile-card-title">Configuración básica</h2>
        <form id="profile-form">
          <div class="profile-form">
            <div class="profile-field">
              <label class="profile-label" for="profile-nombre">Nombre</label>
              <input class="profile-input" id="profile-nombre" type="text" required>
            </div>
            <div class="profile-field">
              <label class="profile-label" for="profile-apellido">Apellido</label>
              <input class="profile-input" id="profile-apellido" type="text">
            </div>
            <div class="profile-field">
              <label class="profile-label" for="profile-email">Correo institucional</label>
              <input class="profile-input" id="profile-email" type="email" readonly>
            </div>
            <div class="profile-field">
              <label class="profile-label" for="profile-matricula">Matrícula</label>
              <input class="profile-input" id="profile-matricula" type="text" readonly>
            </div>
            <div class="profile-field full">
              <label class="profile-label" for="profile-carrera">Carrera</label>
              <input class="profile-input" id="profile-carrera" type="text" placeholder="Ej. Gestión y Desarrollo de Software">
            </div>
            <div class="profile-field full">
              <label class="profile-label" for="profile-avatar-url">URL de foto de perfil</label>
              <input class="profile-input" id="profile-avatar-url" type="url" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="profile-field full">
              <label class="profile-label" for="profile-telefono">Teléfono o contacto opcional</label>
              <input class="profile-input" id="profile-telefono" type="text" placeholder="Opcional">
            </div>
          </div>
          <div class="profile-actions">
            <a class="btn btn-ghost" href="../dashboard.html">Volver al Dashboard</a>
            <button class="btn btn-ghost" id="profile-logout" type="button">Cerrar Sesión</button>
            <button class="btn btn-primary" type="submit">Guardar Perfil</button>
          </div>
          <p class="profile-status" id="profile-status" role="status" aria-live="polite"></p>
        </form>
      </article>

      <aside class="profile-card">
        <h2 class="profile-card-title">Resumen</h2>
        <div class="profile-info-list">
          <div class="profile-info-item">
            <span class="profile-info-label">Usuario</span>
            <span class="profile-info-value" id="summary-name">UThub</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Rol</span>
            <span class="profile-info-value" id="summary-role">Estudiante</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Correo</span>
            <span class="profile-info-value" id="summary-email">Sin correo</span>
          </div>
          <div class="profile-info-item">
            <span class="profile-info-label">Accesos rápidos</span>
            <a href="../comida/pedidos.html">Mis pedidos</a><br>
            <a href="../comida/mi-tienda.html">Mi tienda</a>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script src="../../js/protect.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/perfil.js"></script>
</body>
</html>
