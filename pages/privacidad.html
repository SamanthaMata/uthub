<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso de Privacidad - UThub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, rgba(16, 18, 32, 0.96), rgba(249, 247, 243, 0.92));
      color: #1A1A2E;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(1180px, 100%);
      height: min(92vh, 980px);
      background: rgba(255, 255, 255, 0.98);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid #ECE7E1;
      background: #fff;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
      color: #1A1A2E;
    }
    .brand-subtitle { font-size: 14px; color: #6B6B80; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #F5841F; color: #fff; box-shadow: 0 12px 24px rgba(245, 132, 31, .26); }
    .btn-secondary { background: #F3F1ED; color: #1A1A2E; }
    .panel-body { flex: 1; min-height: 0; background: #F7F4F0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .fallback {
      padding: 18px 24px 24px;
      font-size: 14px;
      color: #6B6B80;
      background: #fff;
      border-top: 1px solid #ECE7E1;
    }
    .fallback a { color: #F5841F; font-weight: 700; text-decoration: none; }
    @media (max-width: 720px) {
      body { padding: 12px; }
      .panel { height: 96vh; border-radius: 22px; }
      .panel-header { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="privacy-title">
    <div class="panel-header">
      <div class="brand">
        <div class="brand-title" id="privacy-title">Aviso de Privacidad</div>
        <div class="brand-subtitle">UThub - UTSC</div>
      </div>
      <div class="actions">
        <a class="btn btn-secondary" href="../UThub_Aviso_Privacidad.pdf" download>Descargar PDF</a>
        <button class="btn btn-primary" type="button" onclick="if (history.length &gt; 1) { history.back(); } else { window.location.href = '../index.html'; }">Cerrar</button>
      </div>
    </div>
    <div class="panel-body">
      <iframe src="../UThub_Aviso_Privacidad.pdf" title="Aviso de Privacidad de UThub"></iframe>
    </div>
    <div class="fallback">
      Si el visor no carga, <a href="../UThub_Aviso_Privacidad.pdf" target="_blank" rel="noreferrer">abre el PDF en una pestaña nueva</a>.
    </div>
  </div>
</body>
</html>
